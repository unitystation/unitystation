name: pr2changelog
on:
  pull_request_target:
    paths-ignore:
      - "CHANGELOG.md"
    branches:
      - develop
    types:
      - closed
      - edited
      - opened

permissions:
  contents: read
  pull-requests: write

jobs:
  dry_check:
    if: github.event.pull_request.merged == false
    name: changelog generator dry check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pr2changelog
        id: pr2changelog
        uses: corp-0/pr2changelog@api-integration
        with:
          categories: Fix;New;Improvement;Balance
          write_to_file: false
          comment_on_pr: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

  after_merge:
    if: github.event.pull_request.merged == true
    name: changelog generator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: pr2changelog
        id: pr2changelog
        uses: corp-0/pr2changelog@api-integration
        with:
          categories: Fix;New;Improvement;Balance
          write_to_file: false
          comment_on_pr: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_secret_token: ${{ secrets.CHANGELOG_API_SECRET }}
          api_url: ${{ secrets.CHANGELOG_API_URL }}
